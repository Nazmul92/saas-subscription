<!DOCTYPE html>

<link rel="stylesheet" href="/styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><span class="logo"></span>Meteroid</div>

  </aside>

  <main class="main">

      <div class="title-wrap">
        <h1 class="title" id="page-title">Subscriptions</h1>

  <div class="drawer-scrim" id="drawer-scrim" hidden></div>
